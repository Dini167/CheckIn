# Render Blueprint — https://render.com/docs/blueprint-spec
# The database is NOT created here: use any PostgreSQL provider (Neon, Supabase, ...)
# and paste its connection string into DATABASE_URL when Render asks for it.
services:
  - type: web
    name: attendance-backend
    runtime: node
    plan: free
    # If the server folder is not the root of your GitHub repository, set rootDir (e.g. "server").
    # rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    # Applies Prisma migrations to the database, then starts the server.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Jerusalem
